[project]
name = "shade-engine"
version = "0.0.0"
description = "Workspace root for the shade-engine monorepo"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "pipeline", "api"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.15",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.9",
    "scipy-stubs>=1.14",
    "types-pyyaml>=6",
]

[tool.ruff]
line-length = 100
src = ["core/src", "pipeline/src", "api/src", "tests"]
# bench/ is a record, not a codebase: each script is the exact thing that
# produced a figure some ADR now defends. Reformatting them after the fact
# breaks that correspondence for no gain, so they stay as they ran. See
# bench/README.md.
extend-exclude = ["bench"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["core/src", "pipeline/src", "api/src", "tests", "scripts"]
mypy_path = ["core/src", "pipeline/src", "api/src", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pvlib.*",
    "pandas.*",
    "laspy.*",
    "rasterio.*",
    "affine.*",
    "shapely.*",
    "mercantile.*",
    "networkx.*",
    "osmnx.*",
]
ignore_missing_imports = true

# pmtiles ships py.typed but its writer is unannotated, which strict mode's
# disallow_untyped_calls rejects at every call site; treat it as untyped.
[[tool.mypy.overrides]]
module = ["pmtiles.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
